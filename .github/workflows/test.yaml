name: Run tests

# GitHub Actions does not support anchors:
# https://github.com/actions/runner/issues/1182
# so we duplicate the lint workflow's path filters and keep them in sync.
on:
  push:
    branches:
      - main
    paths:
        # Python configs
      - 'requirements.txt'
        # Python files
      - '**/*.py'
        # Relevant CI configs
      - '.github/workflows/test.yaml' # this file

  pull_request:
    branches:
      - main
    paths:
        # Python configs
      - 'requirements.txt'
        # Python files
      - '**/*.py'
        # Relevant CI configs
      - '.github/workflows/test.yaml' # this file

  workflow_dispatch:

  schedule:
      # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
      #
      #      ┌───────────── minute (0 - 59)
      #      │ ┌───────────── hour (0 - 23)
      #      │ │ ┌───────────── day of the month (1 - 31)
      #      │ │ │ ┌───────────── month (1 - 12 or JAN-DEC)
      #      │ │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
      #      │ │ │ │ │
    - cron: '1 2 3 * *'  # run at 2:01 every month on the 3rd day

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-26.04' ]
        python: [ '3.14' ]
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qq -y libegl1

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: make test VERBOSE=1
